# Level 1 configuration. Every parameter named in docs/STRATEGY_SPECIFICATION.md
# lives here under the matching key -- nothing below is duplicated as a
# hard-coded literal in source. Env vars (see .env.example) override these
# at the leaves that operators actually need to touch per-deploy.

mode: research   # research | demo | live -- see .env.example for the two-switch live guard

symbols:
  - R_100
  - R_75
  - R_50
  - R_25
  - R_10

contract:
  type: rise_fall        # this build supports Rise/Fall (CALL/PUT) only
  # LIVE CONTRACT HORIZON == RESEARCH HORIZON. Previously the live contract
  # was 5 TICKS (~5-10 seconds) while the backtest, the rejected-signal
  # reconciliation and the Level 2 labels all measured direction 5 CLOSED
  # 60s CANDLES later (~5 minutes). Every number those tools produced was
  # about a different bet than the one actually being placed. The live
  # contract now settles on the same horizon everything else measures:
  # duration x duration_unit must equal duration_bars_approx candles --
  # enforced at startup by config/loader.py. Override per deploy with
  # CONTRACT_DURATION / CONTRACT_DURATION_UNIT (m or s); a tick-based
  # contract is still allowed but logs a loud warning because nothing in
  # this repo can then validate it.
  duration: 5
  duration_unit: m
  duration_bars_approx: 5

candles:
  timeframe_seconds: 60
  # Nothing in the feature set needs more history than the largest lookback
  # it's built from (vol_lookback=200 is the biggest). Capping the window
  # handed to the feature engine each bar keeps evaluation O(1) per bar
  # instead of O(n) -- recomputing swings and percentiles over the ENTIRE
  # history on every closed candle made a backtest quadratic in candle
  # count (a 5,000-candle run took over a minute). Kept comfortably above
  # the largest lookback rather than exactly matching it.
  max_lookback_bars: 400
  # candles fetched at startup; the extra history warms the percentile
  # threshold's score history so setups can qualify from the first bar
  seed_bars: 1500

stretch:
  lookback: 20
  ema_fast_period: 9
  bollinger_k: 2.0
  percentile_lookback: 100
  z_cap: 3.0
  atr_cap: 2.5

volatility:
  atr_period: 14
  vol_lookback: 200
  vol_high_percentile: 80
  vol_low_percentile: 20

momentum:
  rsi_period: 14
  rsi_slope_lookback: 3
  rsi_oversold: 30
  rsi_overbought: 70
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  roc_period: 10
  ema_slope_lookback: 5

price_action:
  rejection_wick_ratio: 2.0
  rejection_range_min: 0.5
  failure_lookback: 5

structure:
  swing_window: 3
  zone_merge_pct: 0.0015
  zone_decay_half_life: 100
  reclaim_lookback: 5
  sr_proximity_atr: 1.0
  sr_min_strength: 2.0

regime:
  adx_period: 14
  trend_slope_min: 0.001
  adx_trend_min: 25
  adx_range_max: 20
  min_bars: 50
  threshold_multiplier:
    TREND_UP: 1.4
    TREND_DOWN: 1.4
    RANGE: 1.0
    TRANSITION: 1.2
    # UNKNOWN has no multiplier -- it's a hard gate, not a soft one.
  disable_on_high_vol: true

reversal:
  # Must sum to 1.0 -- validated at startup, not silently renormalized.
  weights:
    stretch: 0.30
    exhaustion: 0.25
    price_action: 0.20
    support_resistance: 0.15
    divergence: 0.10
  setup_threshold: 55.0
  confirmation_window: 3
  # DATA-CALIBRATED SETUP THRESHOLD. The absolute 55 (x1.4 in trends = 77)
  # was never calibrated to how the score is actually distributed: on
  # random-walk-like data (what Deriv volatility indices are built to be)
  # ranging markets almost never reach 55, and the high readings that do
  # occur are nearly all counter-trend, where 77 applies -- 12,000 bars
  # produced ZERO setups in testing. In `percentile` mode a setup is the
  # strongest readings on the symbol's OWN recent history instead: the
  # score must be in the top (100 - setup_percentile)% of the last
  # score_history_bars bars (computed from PRIOR bars only -- no
  # lookahead), stricter in trends exactly as the regime multiplier was,
  # and never below min_absolute_score. Whether these setups are GOOD is
  # measured, not assumed: setup_outcomes + the MC expiry gate.
  # `absolute` restores the original behavior.
  threshold_mode: percentile
  setup_percentile:
    RANGE: 98.0
    TRANSITION: 99.0
    TREND_UP: 99.5
    TREND_DOWN: 99.5
  min_absolute_score: 35.0
  score_history_bars: 1440
  min_score_history: 300

edge:
  # Level 1 has no calibrated probability (that's Level 2's job -- see
  # strategy/edge_engine.py), so this is a payout-quality floor, not a
  # computed expected value. A contract quoted below this multiple is
  # refused regardless of how strong the reversal signal is.
  min_payout_multiple: 1.80

risk:
  base_stake: 1.0
  max_stake: 5.0
  max_daily_loss: 25.0
  max_drawdown: 50.0
  max_consecutive_losses: 8
  max_trades_per_day: 100
  max_concurrent_trades: 1
  cooldown_seconds: 0.0
  stale_tick_seconds: 30.0
  max_proposal_age_seconds: 5.0
  # extra time allowed past contract expiry for Deriv's settlement message
  # before the bot switches to polling for the result. An unknown outcome
  # is NEVER recorded as a loss -- the trade stays open until it settles.
  settlement_grace_seconds: 60.0

staking:
  method: fixed   # fixed | percentage | kelly | martingale
  # Section 37: martingale OFF by default for this system, without
  # exception -- "do not attempt to recover losses automatically by
  # increasing stake" is stated as a default, and this build honors that
  # default even though the sibling Even/Odd bot runs martingale on.
  martingale_enabled: false
  martingale_trigger_losses: 2
  martingale_factor: 2.0
  martingale_max_steps: 3
  kelly_fraction: 0.25

expiry:
  # Monte Carlo-calibrated expiry per trade -- see strategy/expiry.py.
  # When on, each confirmed setup is priced at the expiries with the best
  # conservative P(win) from real recorded outcomes, and bought at whichever
  # gives the best worst-case EV at the real quoted payout. Until a horizon
  # has min_samples outcomes the bot uses contract.duration/duration_unit
  # under Level 1 rules, so trades open while evidence builds.
  enabled: true
  horizons: [3t, 5t, 7t, 10t, 1m, 2m, 3m, 5m]
  min_samples: 200               # simulated: noise passes the gate ~1.3%, a true 56% edge ~50% at 200 / 94% at 800
  lookback_days: 14              # only recent evidence -- markets drift
  credible_quantile: 0.05        # before the Bonferroni split across horizons
  mc_draws: 4000
  pool_symbols: true             # borrow strength across symbols while a symbol's own sample is small
  require_edge: true             # worst-case EV (lower-bound P(win) x payout - 1) must be > 0
  proposals_to_price: 3          # real Deriv quotes requested per setup (rate-limit budget)
  refresh_seconds: 300           # re-read outcome counts from the DB
  seconds_per_tick: 2.0          # settlement-wait estimate for tick contracts

level2:
  # Calibrated P(win) model trained by `python main.py --train`. Used live
  # ONLY when enabled here (or LEVEL2_ENABLED=true) AND the saved model
  # passed the walk-forward promotion bar -- a model that failed it is
  # saved for inspection but never trades. When active, a trade also needs
  # a positive expected value computed from the model probability and the
  # REAL proposal payout (Sections 25/26), on top of every Level 1 check.
  enabled: false
  model_path: data/level2_model.json
  min_ev: 0.0                  # EV per unit staked: p * payout_multiple - 1
  # require the LOWER confidence bound of P(win) to clear break-even
  # (1 / payout_multiple), not just the point estimate
  require_lower_bound_edge: true
  n_blocks: 5
  min_block_size: 200
  promotion_corr_floor: 0.05

operations:
  # counterfactual outcomes for rejected signals, reconciled while live
  # instead of only via a manual `--reconcile` run
  reconcile_interval_seconds: 300
  # re-read the real account balance so drawdown/stake checks don't drift
  balance_refresh_seconds: 300

storage:
  path: data/reversal.db

logging:
  level: INFO

backtest:
  n_blocks: 5
  warmup_bars: 210
